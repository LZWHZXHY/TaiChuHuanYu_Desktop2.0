[package]
name = "tchy_dt_2_0"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tchy_dt_2_0_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"   # 新增这一行
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
